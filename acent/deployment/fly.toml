# acent-ax-engine — Fly.io app config
#
# Single-process deployment, mirroring local usage:
#
#   $ hermes dashboard          # locally — dashboard owns gateway lifecycle
#
# One machine runs `hermes dashboard` (port 9119) which serves the SPA +
# /api/* and spawns `hermes gateway run` as a child via the shell wrapper.
# tini (PID 1, baked into the upstream Dockerfile) reaps both processes.
#
# Public for now — `API_SERVER_KEY` is the only access guard for /v1/*.
# The dashboard itself has no auth; treat the URL as semi-secret and
# rotate `GEMINI_API_KEY` periodically (it leaks via /api/env/reveal if
# the URL is discovered).
#
# TODO: add real dashboard auth (Caddy Basic Auth sidecar or similar) —
# tracked as a Phase 4 follow-up.

app             = "acent-ax-engine"
primary_region  = "nrt"

[build]
  # Resolved relative to this fly.toml's directory.
  dockerfile = "../../Dockerfile"

[env]
  API_SERVER_ENABLED    = "true"
  API_SERVER_HOST       = "0.0.0.0"
  API_SERVER_MODEL_NAME = "hermes-agent"
  API_SERVER_PORT       = "8642"

[processes]
  app = "sh -c 'hermes gateway run > /opt/data/gateway.log 2>&1 & exec hermes dashboard --host 0.0.0.0 --port 9119 --no-open --insecure'"

# Public ingress → dashboard at the root URL.
[http_service]
  internal_port        = 9119
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"
    method       = "GET"
    path         = "/api/status"
    protocol     = "http"

# OpenAI-compatible gateway on :8642 — acent-flow reaches it via
# `acent-ax-engine.flycast:8642`.
[[services]]
  protocol      = "tcp"
  internal_port = 8642
  processes     = ["app"]

  [[services.ports]]
    port     = 8642
    handlers = ["http"]

  [[services.tcp_checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"

[[vm]]
  memory   = "1024"
  cpu_kind = "shared"
  cpus     = 1
