[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acent-ax-bridge"
version = "0.1.0"
description = "FastAPI ↔ Hermes ACP bridge for the ACENT AX engine (Phase 1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ACENT Labs" }]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["ax_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
