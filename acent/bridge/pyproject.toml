[project]
name = "acent-ax-bridge"
version = "0.1.0"
description = "FastAPI ↔ Hermes ACP bridge for the ACENT AX engine"
requires-python = ">=3.11"
dependencies = [
    # ACP client + agent-client-protocol stdio transport
    "agent-client-protocol>=0.4",
    # HTTP/SSE surface
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.5",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ax_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
